<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>rsg-inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="layout">
            <!-- Player -->
            <section class="panel" id="panel-player">
                <header class="panel-head">
                    <div class="title" id="player-label" data-l="ui_satchel">Satchel</div>
                    <div class="subtitle" data-l="ui_belongings">Your belongings</div>
                    <button class="circle-btn close-btn" data-action="close" data-l-title="ui_close" title="Close">✕</button>
                </header>
                <div class="weight">
                    <div class="weight-text"><span id="player-weight">0.0</span> / <span id="player-max">0.0</span> <span data-l="ui_kg">kg</span></div>
                    <div class="bar"><div class="fill stat-good" id="player-bar"></div></div>
                </div>
                <div class="divider"><span>✦</span></div>
                <div class="filters" id="filter-player"></div>
                <div class="grid" id="grid-player" data-inv="player"></div>
            </section>

            <!-- Controls -->
            <section class="controls">
                <div class="info-card" id="info">
                    <div class="info-title" id="info-title">—</div>
                    <div class="ink-divider"></div>
                    <div class="info-desc" id="info-desc" data-l="ui_inspect">Hover over an item to inspect it.</div>
                    <div class="info-meta" id="info-meta"></div>
                </div>
                <label class="amount-label" data-l="ui_amount">Amount</label>
                <input type="number" min="0" id="amount" value="0" class="amount-input" data-l-title="ui_amount_tip" title="0 = whole stack">
                <div class="drop-zone" data-zone="use" data-l="ui_use">Use</div>
                <div class="drop-zone" data-zone="give" data-l="ui_give">Give</div>
                <div class="hint" data-l="ui_hint">Drag to move · Shift-drag: half · Ctrl-click: quick move · Right-click: options · Double-click: use</div>
            </section>

            <!-- Other (stash / ground) -->
            <section class="panel" id="panel-other">
                <header class="panel-head">
                    <div class="title" id="other-label" data-l="ui_ground">Ground</div>
                    <div class="subtitle" id="other-sub" data-l="ui_drop_here">Drop items here</div>
                </header>
                <div class="weight">
                    <div class="weight-text"><span id="other-weight">0.0</span> / <span id="other-max">0.0</span> <span data-l="ui_kg">kg</span></div>
                    <div class="bar"><div class="fill stat-good" id="other-bar"></div></div>
                </div>
                <div class="divider"><span>✦</span></div>
                <div class="filters" id="filter-other"></div>
                <div class="grid" id="grid-other" data-inv="other"></div>
            </section>
        </div>
    </div>

    <div id="hotbar" class="hotbar hidden"></div>
    <div id="itembox-container"></div>
    <div id="ghost" class="ghost hidden"></div>

    <!-- right-click menu -->
    <div id="ctx" class="ctx hidden">
        <div class="ctx-title" id="ctx-title"></div>
        <ul class="ctx-list" id="ctx-list"></ul>
    </div>

    <!-- amount prompt -->
    <div id="amount-modal" class="modal-wrap hidden">
        <div class="modal">
            <div class="modal-title" id="amount-modal-title"></div>
            <div class="ink-divider"></div>
            <input type="number" min="1" id="amount-modal-input" class="amount-input">
            <div class="modal-max" id="amount-modal-max"></div>
            <div class="modal-actions">
                <button class="wood-btn muted" data-modal="cancel" data-l="ui_cancel">Cancel</button>
                <button class="wood-btn" data-modal="confirm" data-l="ui_confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
